<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Project Management</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main>
    <h1>Admin Dashboard</h1>
    <p>US-103 — Bản demo frontend, sử dụng số liệu mẫu.</p>

    <section aria-labelledby="metrics-title">
      <h2 id="metrics-title">Tổng quan sử dụng</h2>

      <ul>
        <li>Tổng người dùng: 120</li>
        <li>Người dùng hoạt động: 78</li>
        <li>Lượt đăng nhập hôm nay: 35</li>
      </ul>
    </section>

    <section aria-labelledby="activity-title">
      <h2 id="activity-title">Hoạt động gần đây</h2>

      <table>
        <caption>Dữ liệu hoạt động minh họa</caption>
        <thead>
          <tr>
            <th scope="col">Thời điểm</th>
            <th scope="col">Hoạt động</th>
            <th scope="col">Số lượt</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Hôm nay</td>
            <td>Đăng nhập</td>
            <td>35</td>
          </tr>
          <tr>
            <td>Hôm qua</td>
            <td>Đăng nhập</td>
            <td>28</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
